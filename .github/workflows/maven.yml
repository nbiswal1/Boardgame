name: Java CI with Maven

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:

  # ============================================================
  # 1. BUILD APPLICATION
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven Dependencies
        run: mvn -B dependency:resolve

      - name: Build with Maven
        run: mvn -B package --file pom.xml


  # ============================================================
  # 2. TRIVY FILESYSTEM SCAN
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-22.04
    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Download Maven dependencies before Trivy scans.
      # This helps avoid Maven Central 429 rate-limit errors.
      - name: Resolve Maven Dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy
        run: |
          trivy --version

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln \
            --format table \
            -o fs.html \
            .


  # ============================================================
  # 3. SONARQUBE SCAN
  # ============================================================
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-22.04
    needs: trivy-fs

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven Dependencies
        run: mvn -B dependency:resolve

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 4. SONARQUBE QUALITY GATE
  # ============================================================
  sonarqube-quality-gate:
    name: SonarQube Quality Gate
    runs-on: ubuntu-22.04
    needs: sonarqube

    steps:

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 5. DOCKER BUILD + TRIVY IMAGE SCAN + PUSH
  # ============================================================
  docker:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-22.04
    needs: sonarqube-quality-gate

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Setup
      # --------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t adijaiswal/boardgame:latest \
            .

      # --------------------------------------------------------
      # Install Trivy
      # --------------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy
        run: |
          trivy --version

      # --------------------------------------------------------
      # Trivy Docker Image Scan
      # --------------------------------------------------------
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --scanners vuln \
            --format table \
            -o trivy-image-report.html \
            adijaiswal/boardgame:latest

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Push Docker Image
      # --------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push adijaiswal/boardgame:latest
